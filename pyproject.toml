[project]
name = "claims-coverage-assessment-assistant"
version = "2.0.0"
description = "AI claims adjudication copilot: tool-calling agent over MCP, RAG with a real ingestion pipeline, code-enforced decisions, evals, and human-in-the-loop review."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "motor>=3.6",
    "mcp>=1.28,<2",
    "openai>=1.60",
    "langgraph>=1.0",
    "langgraph-checkpoint-mongodb>=0.3",
    "pymupdf>=1.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[project.optional-dependencies]
# Langfuse tracing is optional: the app runs (and logs) fine without it.
tracing = ["langfuse>=3"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "mongomock-motor>=0.0.34",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
src = ["src", "."]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom
